# Local PostgreSQL for development. Tests use Testcontainers and do not need this.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: jla
      POSTGRES_PASSWORD: jla-dev-only
      POSTGRES_DB: jla
    ports:
      - "5432:5432"
    volumes:
      - jla-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jla -d jla"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  jla-pg:
